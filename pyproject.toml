[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "momentum-backtester"
version = "0.1.0"
description = "Walk-forward backtesting engine for a US equity cross-sectional momentum strategy."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Izzat Azzim" }]
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "matplotlib>=3.8",
    "yfinance>=0.2.40",
    "pyarrow>=14",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.5",
    # pinned <1.19, newer versions need librt which Smart App Control blocks on my machine
    "mypy>=1.10,<1.19",
    "pandas-stubs>=2.1",
]

[project.scripts]
momentum = "momentum.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "NPY", "PD"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["yfinance.*", "matplotlib.*"]
ignore_missing_imports = true
